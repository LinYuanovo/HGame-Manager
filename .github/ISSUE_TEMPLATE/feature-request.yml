name: 功能请求
description: 新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：
        - 已查阅项目 README 或文档，确认该功能尚未实现；
        - 已搜索现有 Issue（包括已关闭的），确认没有重复请求。

  - type: textarea
    id: motivation
    attributes:
      label: 想解决的问题
      description: 这个功能请求源于什么场景或痛点？
      placeholder: 例如：整理库时无法批量跳过已检查项……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能或改进
      description: 清晰、简洁地描述您希望增加的功能或改进方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他实现方式或临时解决办法？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 附加材料
      description: 示意图、参考链接或其他补充说明。可直接拖拽文件到输入框上传。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 自检清单
      description: 提交前请确认以下事项。
      options:
        - label: 我已搜索现有 Issue，确认没有重复请求。
          required: true
